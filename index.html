<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f9fd" />
    <title>Satta — вопрос по метрике</title>
    <meta name="description" content="Задайте вопрос по экономическому капиталу." />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="top top--row">
      <span class="top__brand">Satta</span>
      <nav class="top__nav">
        <a class="top__link" href="synonyms.html">Синонимы</a>
        <a class="top__link" href="logs.html">Логи</a>
      </nav>
    </header>

    <main class="page">
      <p class="hint">Задайте свой вопрос</p>
      <h1 class="title">По метрике экономического капитала</h1>

      <form class="ask" id="ask-form" novalidate>
        <label class="sr-only" for="question">Ваш вопрос</label>
        <textarea
          id="question"
          name="question"
          class="ask__input"
          rows="4"
          placeholder="Например: какой ЭК по портфелю «Корпоративный» на сегодня?"
          required
        ></textarea>
        <button class="ask__btn" type="submit">Спросить</button>
      </form>

      <div class="answer" id="answer" hidden aria-live="polite">
        <p class="answer__label">Ответ (превью)</p>
        <p class="answer__text" id="answer-text"></p>
      </div>
    </main>

    <script src="agents/synonym-agent.js"></script>
    <script src="ask.js"></script>
  </body>
</html>
