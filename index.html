<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f9fd" />
    <title>Пользовательский чат — вопрос по метрике</title>
    <meta name="description" content="Задайте вопрос по экономическому капиталу." />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <header class="top top--row">
      <span class="top__brand">Пользовательский чат</span>
      <nav class="top__nav">
        <a class="top__link" href="synonyms.html">Синонимы</a>
        <a class="top__link" href="logs.html">Логи</a>
        <a class="top__link" href="ontology.html">Онтология</a>
        <a class="top__link" href="architecture.html">Архитектура</a>
      </nav>
    </header>

    <main class="page">
      <p class="hint">Задайте свой вопрос</p>
      <h1 class="title">По метрике экономического капитала</h1>

      <form class="ask" id="ask-form" novalidate>
        <label class="sr-only" for="question">Ваш вопрос</label>
        <textarea
          id="question"
          name="question"
          class="ask__input"
          rows="4"
          placeholder="Например: какой ЭК по портфелю «Корпоративный» на сегодня?"
          required
        ></textarea>
        <button class="ask__btn" type="submit">Спросить</button>
      </form>

      <p class="page-links">
        <a href="ontology.html">Онтология</a>
        ·
        <a href="architecture.html">Архитектура Semantic Layer</a>
      </p>

      <div class="clarify" id="clarify" hidden aria-live="polite">
        <p class="clarify__label">Уточнение</p>
        <p class="clarify__text" id="clarify-text"></p>
        <div class="clarify__actions">
          <button class="ask__btn clarify__btn" type="button" id="clarify-yes">Да, верно</button>
          <button class="ask__btn clarify__btn clarify__btn--ghost" type="button" id="clarify-no">
            Нет
          </button>
        </div>
      </div>
    </main>

    <script src="agents/morphology.js"></script>
    <script src="agents/date-parser.js"></script>
    <script src="agents/attribute-bridge.js"></script>
    <script src="agents/ontology-index.js"></script>
    <script src="agents/synonym-agent.js"></script>
    <script src="agents/semantic-layer-agent.js"></script>
    <script src="agents/sql-agent.js"></script>
    <script src="agents/pipeline.js"></script>
    <script src="ask.js"></script>
  </body>
</html>
